name: BEDC Build

# Single source of truth for PDF + Lean4 build. Runs on any push / PR that
# touches paper, lean, dossier source, or any workflow file involved in the
# build chain. Uploads `bedc-pdf` for downstream consumers and exercises the
# dossier HTML artifact handoff on pull requests.

on:
  push:
    branches:
      - auto-dev
      - dev
      - main
      - feature/dossier
    paths:
      - 'docs/dossier/**'
      - 'papers/bedc/**'
      - 'papers/bedc_jepa/**'
      - 'lean4/**'
      - 'tools/**'
      - '.github/workflows/build-paper.yml'
      - '.github/workflows/dossier.yml'
      - '.github/workflows/daily-build.yml'
      - '.github/workflows/reusable-pdf.yml'
      - '.github/workflows/reusable-lean4.yml'
      - '.github/workflows/reusable-dossier-render.yml'
  pull_request:
    paths:
      - 'docs/dossier/**'
      - 'papers/bedc/**'
      - 'papers/bedc_jepa/**'
      - 'lean4/**'
      - 'tools/**'
      - '.github/workflows/build-paper.yml'
      - '.github/workflows/dossier.yml'
      - '.github/workflows/daily-build.yml'
      - '.github/workflows/reusable-pdf.yml'
      - '.github/workflows/reusable-lean4.yml'
      - '.github/workflows/reusable-dossier-render.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  # PR runs scope to the PR number so concurrent PRs don't cancel each
  # other; push runs scope to the ref so superseded pushes cancel.
  group: build-paper-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect_changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      tex: ${{ steps.detect.outputs.tex }}
      lean4: ${{ steps.detect.outputs.lean4 }}
      dossier: ${{ steps.detect.outputs.dossier }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: detect
        run: |
          # Trigger path filters already restrict this workflow to relevant
          # changes. Keep both validations on so workflow-file changes also
          # exercise the PDF and Lean jobs they affect.
          echo "tex=true" >> "$GITHUB_OUTPUT"
          echo "lean4=true" >> "$GITHUB_OUTPUT"
          dossier=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            while IFS= read -r path; do
              case "$path" in
                docs/dossier/*)
                  dossier=true
                  ;;
              esac
            done < <(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
          fi
          echo "dossier=$dossier" >> "$GITHUB_OUTPUT"

      - name: Write summary
        run: |
          {
            echo "build-paper path detection"
            echo
            echo "- run PDF validation: \`${{ steps.detect.outputs.tex }}\`"
            echo "- run Lean4 validation: \`${{ steps.detect.outputs.lean4 }}\`"
            echo "- run dossier render: \`${{ steps.detect.outputs.dossier }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check workflow checkout safety
        run: python3 tools/check_workflow_checkout_safety.py

  build_pdf:
    name: Build main.pdf
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.tex == 'true' }}
    uses: ./.github/workflows/reusable-pdf.yml
    with:
      upload_artifact: true
      artifact_name: bedc-pdf
      artifact_retention_days: 14
    secrets: inherit

  build_lean4:
    name: Build Lean4
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.lean4 == 'true' }}
    uses: ./.github/workflows/reusable-lean4.yml
    secrets: inherit

  build_bedc_jepa_pdf:
    name: Build BEDC-JEPA PDF
    needs: detect_changes
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xu-cheng/texlive-full@sha256:8b4a00b6a17ebe6b96dee107d82f0cb3eb40daf322f1e23809a9be26486963dd
    defaults:
      run:
        shell: bash
        working-directory: papers/bedc_jepa
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Build BEDC-JEPA main.pdf
        run: make precheck && make

  build_conformal_lean:
    name: Build conformal-lean
    needs: detect_changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Guard against forbidden Lean primitives
        run: |
          set -euo pipefail
          pkg=papers/bedc_jepa/formal/bedc-conformal-lean
          if grep -REn '\b(axiom|sorry|admit)\b' "$pkg"/*.lean; then
            echo "forbidden Lean primitive (axiom/sorry/admit) present in conformal-lean"
            exit 1
          fi

      - name: Build conformal-lean package
        uses: leanprover/lean-action@c544e89643240c6b398f14a431bcdc6309e36b3e # v1
        with:
          lake-package-directory: papers/bedc_jepa/formal/bedc-conformal-lean
          build: true
          use-mathlib-cache: false
          use-github-cache: "false"

      - name: Verify theorems depend on zero axioms
        working-directory: papers/bedc_jepa/formal/bedc-conformal-lean
        run: |
          set -euo pipefail
          out="$(lake env lean ConformalCounting.lean 2>&1)"
          echo "$out"
          for thm in fail_closed_selects_empty selected_satisfies_conservative_bound coverage_counting_correct cumFail_monotone; do
            echo "$out" | grep -q "'ConformalCounting.$thm' does not depend on any axioms" \
              || { echo "axiom-freedom check failed for $thm"; exit 1; }
          done
          if echo "$out" | grep -Eq 'propext|Classical\.choice|Quot\.sound'; then
            echo "forbidden stdlib axiom dependency present in conformal-lean"
            exit 1
          fi

  dossier_source_tests:
    name: Dossier source regression tests
    needs: detect_changes
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Python test dependencies
        run: python3 -m pip install --user pytest pyyaml

      - name: Run dossier source regression tests
        run: python3 -m pytest tools/test_namecert_html.py tools/test_dossier_runtime.py tools/test_check_glossary.py -q

  render_dossier_check:
    name: Render dossier check
    needs: [detect_changes, build_pdf]
    if: ${{ github.event_name == 'pull_request' && needs.detect_changes.outputs.dossier == 'true' }}
    uses: ./.github/workflows/reusable-dossier-render.yml
    permissions:
      contents: read
      actions: read
    with:
      checkout_ref: ${{ github.sha }}
      checkout_repository: ${{ github.repository }}
      pdf_run_id: ""
      upload_pages_artifact: false

  gate:
    name: Gate
    needs: [detect_changes, build_pdf, build_lean4, build_bedc_jepa_pdf, build_conformal_lean, dossier_source_tests, render_dossier_check]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          detect_result="${{ needs.detect_changes.result }}"
          pdf_result="${{ needs.build_pdf.result }}"
          lean4_result="${{ needs.build_lean4.result }}"
          bedc_jepa_result="${{ needs.build_bedc_jepa_pdf.result }}"
          conformal_lean_result="${{ needs.build_conformal_lean.result }}"
          source_test_result="${{ needs.dossier_source_tests.result }}"
          dossier_result="${{ needs.render_dossier_check.result }}"

          {
            echo "build-paper results"
            echo
            echo "- detect_changes: \`$detect_result\`"
            echo "- build_pdf: \`$pdf_result\`"
            echo "- build_lean4: \`$lean4_result\`"
            echo "- build_bedc_jepa_pdf: \`$bedc_jepa_result\`"
            echo "- build_conformal_lean: \`$conformal_lean_result\`"
            echo "- dossier_source_tests: \`$source_test_result\`"
            echo "- render_dossier_check: \`$dossier_result\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # detect_changes must succeed.
          if [ "$detect_result" != "success" ]; then
            exit 1
          fi
          # Each sub-job: must be `success` (ran and passed) or `skipped`
          # (path detection said not needed). Any other state fails the gate.
          for r in "$pdf_result" "$lean4_result" "$bedc_jepa_result" "$conformal_lean_result" "$source_test_result" "$dossier_result"; do
            case "$r" in
              success|skipped) : ;;
              *) exit 1 ;;
            esac
          done
